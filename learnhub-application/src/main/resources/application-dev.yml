server:
  port: 8080
spring:
  application:
    name: learnhub
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:learnhub}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:learnhub}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 45MB

logging:
  level:
    com.github.comui520.learnhub: DEBUG

learnhub:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
    expiration: 3600000


  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:learnhub}
    secret-key: ${MINIO_ROOT_PASSWORD:123456789}
    bucket: ${MINIO_BUCKET:learnhub-docs}
